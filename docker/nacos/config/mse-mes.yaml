# ==================== mse-mes 专属配置（Data ID: mse-mes.yaml    Group: DEFAULT_GROUP） ====================
# 本文件是服务 application.yaml 的本地留档：经 init-configs.sh 写入 Nacos 后由配置中心管理，
# 共享项（master 数据源/Redis/Sa-Token/MyBatis-Plus/Dubbo/租户开关/Seata）见 mse-micro-common/db/dubbo.yaml。
server:
  port: 8098

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,slowsql
# actuator 鉴权令牌不在此处——共享 mse-micro-common.yaml 的 mse.actuator.auth.token
# （${MSE_ACTUATOR_TOKEN:} 占位，空 = 关闭）已随 spring.config.import 覆盖本服务。

# 未启用 Seata 前显式关闭动态数据源的 seata 集成（启用 Seata 时删除本行，
# Seata 已随 micro-starter 内置（开启 MSE_SEATA_ENABLED 即用）；undo_log 在 jar 内 db/tenant 迁移脚本中随启动自动应用）
spring:
  datasource:
    dynamic:
      seata: false

# ==================== 独立库租户数据源（可选） ====================
# 推荐方式：平台端「平台管理 → 租户数据源」界面维护并绑定租户（shared 共享库多租户 / dedicated 一库一租户），
# 运行时注册无需重启，本文件无需配置。下方为静态兼容方式示例（同 key 时界面维护的动态数据源优先）：
# 平台端开通 ds_key=tenant2 的租户且实体标注 @TenantDatasource 时，该表读写路由至此库；
# strict=false：租户 ds_key 未注册对应数据源时回落 master，等价共享库语义。
# 独立库业务表不再需要手工建：界面初始化/懒初始化按 db/tenant 版本化脚本克隆+迁移自动就绪。
# spring:
#   datasource:
#     dynamic:
#       datasource:
#         tenant2:
#           driver-class-name: com.mysql.cj.jdbc.Driver
#           url: jdbc:mysql://${MSE_MYSQL_HOST:localhost}:${MSE_MYSQL_PORT:3306}/mse_tenant2?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useInformationSchema=true&nullCatalogMeansCurrent=true
#           username: ${MSE_MYSQL_USER:root}
#           password: ${MSE_MYSQL_PASSWORD:123456}

